<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen / Safari pinned icons don't support SVG — one PNG covers that case. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Event Storming Modeler</title>
    <!-- Fonts are self-hosted via @fontsource (Geist, imported in src/main.ts) –
         no external Google Fonts CDN (works offline & GDPR-compliant). -->
  </head>
  <body>
    <div id="app">
      <!-- Canvas fills the whole area; the chrome floats above it (Excalidraw style, no header). -->
      <div class="app-stage">
        <div id="canvas" class="app-canvas"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-card">
            <img class="empty-mark" src="/favicon.svg" width="60" height="60" alt="" />
            <h2>Event Storming Modeler</h2>
            <p>Start a new board, or open the example.</p>
            <div class="empty-actions">
              <button id="btn-new" type="button" class="primary">New board</button>
              <button id="btn-example" type="button" class="ghost">Show example</button>
            </div>
            <span class="empty-hint"
              >or drag&nbsp;&amp;&nbsp;drop a .storm · .txt · .json file</span
            >
          </div>
        </div>
      </div>

      <!-- Floating menu, top left -->
      <div class="app-menu" id="app-menu">
        <button
          id="btn-menu"
          type="button"
          class="icon-btn"
          aria-haspopup="true"
          aria-expanded="false"
          title="Menu"
        >
          Menu
        </button>
        <div id="menu-dropdown" class="menu-dropdown" role="menu" hidden>
          <button id="m-open" type="button" class="menu-item" role="menuitem">Open…</button>
          <button id="m-example" type="button" class="menu-item" role="menuitem">
            Show example
          </button>
          <button id="m-new" type="button" class="menu-item" role="menuitem">New / clear</button>
          <div class="menu-sep" role="separator"></div>
          <button id="m-undo" type="button" class="menu-item" role="menuitem">Undo</button>
          <button id="m-redo" type="button" class="menu-item" role="menuitem">Redo</button>
          <div class="menu-sep" role="separator"></div>
          <button id="m-json" type="button" class="menu-item" role="menuitem">Export · JSON</button>
          <button id="m-dsl" type="button" class="menu-item" role="menuitem">
            Export · DSL (.storm)
          </button>
          <button id="m-svg" type="button" class="menu-item" role="menuitem">Export · SVG</button>
          <button id="m-png" type="button" class="menu-item" role="menuitem">
            Export · PNG (2×)
          </button>
          <button id="m-png-transparent" type="button" class="menu-item" role="menuitem">
            Export · PNG (4×, transparent)
          </button>
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label" role="presentation">Level</div>
          <button
            id="m-level-big-picture"
            type="button"
            class="menu-item"
            role="menuitemradio"
            aria-checked="false"
          >
            Big Picture
          </button>
          <button
            id="m-level-process"
            type="button"
            class="menu-item"
            role="menuitemradio"
            aria-checked="false"
          >
            Process Modelling
          </button>
          <button
            id="m-level-design"
            type="button"
            class="menu-item"
            role="menuitemradio"
            aria-checked="true"
          >
            Software Design
          </button>
        </div>
      </div>

      <!-- Floating share button, top right -->
      <div class="app-toolbar">
        <button id="btn-share" type="button" class="primary">Share</button>
      </div>

      <!-- Zoom controls, bottom right (Excalidraw style) -->
      <div class="app-zoom" role="toolbar" aria-label="Zoom">
        <button id="z-out" type="button" class="zoom-btn" title="Zoom out (Ctrl+-)">−</button>
        <button id="z-level" type="button" class="zoom-level" title="Fit board (Ctrl+0)">
          100%
        </button>
        <button id="z-in" type="button" class="zoom-btn" title="Zoom in (Ctrl++)">+</button>
      </div>
      <input id="file-input" type="file" accept=".json,.storm,.txt" hidden />

      <footer class="app-legal" aria-label="Legal">
        <a href="https://miragon.io/" target="_blank" rel="noopener noreferrer"
          >&copy;&nbsp;<span id="legal-year">2026</span>&nbsp;Miragon</a
        >
        <span aria-hidden="true">·</span>
        <a href="https://miragon.io/impressum/" target="_blank" rel="noopener noreferrer"
          >Impressum</a
        >
        <span aria-hidden="true">·</span>
        <a href="https://miragon.io/datenschutz/" target="_blank" rel="noopener noreferrer"
          >Datenschutz</a
        >
        <span aria-hidden="true">·</span>
        <a
          href="https://github.com/Miragon/event-storming-modeler"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </footer>
    </div>

    <div id="output" class="output-overlay" hidden>
      <div class="output-panel">
        <header class="output-head">
          <span id="output-title">Export</span>
          <div class="output-actions">
            <button id="output-copy" type="button" class="ghost">Copy</button>
            <button id="output-close" type="button" class="ghost">Close</button>
          </div>
        </header>
        <textarea id="output-text" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
