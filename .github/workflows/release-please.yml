name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate packaging/publish without releasing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      schema_model_released: ${{ steps.release_please.outputs['packages/schema-model--release_created'] }}
      dsl_released: ${{ steps.release_please.outputs['packages/dsl--release_created'] }}
      transforms_released: ${{ steps.release_please.outputs['packages/transforms--release_created'] }}
      renderer_released: ${{ steps.release_please.outputs['packages/renderer--release_created'] }}
      vscode_released: ${{ steps.release_please.outputs['apps/vscode--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm-schema-model:
    needs: release-please
    if: needs.release-please.outputs.schema_model_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: schema-model

  publish-npm-dsl:
    needs: release-please
    if: needs.release-please.outputs.dsl_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: dsl

  publish-npm-transforms:
    needs: release-please
    if: needs.release-please.outputs.transforms_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: transforms

  publish-npm-renderer:
    needs: release-please
    if: needs.release-please.outputs.renderer_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: renderer

  publish-vscode:
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    # Pinned like the smoke workflow: VS Code needs the image's X server and GTK libraries.
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o event-storming-modeler.vsix
      # The VSIX this job uploads, in a real VS Code: a package that does not activate never ships.
      - name: Smoke-test the VSIX in VS Code
        run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_VSIX: ${{ github.workspace }}/apps/vscode/event-storming-modeler.vsix
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      # The release is already tagged when this smoke fails, so its screenshots and VS Code's logs are
      # all there is to tell why.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-smoke-marketplace
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode
        run: npx vsce publish --packagePath event-storming-modeler.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH }}

  publish-open-vsx:
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    # Pinned like the smoke workflow: VS Code needs the image's X server and GTK libraries.
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o event-storming-modeler.vsix
      # The VSIX this job uploads, in a real VS Code: a package that does not activate never ships.
      - name: Smoke-test the VSIX in VS Code
        run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_VSIX: ${{ github.workspace }}/apps/vscode/event-storming-modeler.vsix
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      # The release is already tagged when this smoke fails, so its screenshots and VS Code's logs are
      # all there is to tell why.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-smoke-open-vsx
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish to Open VSX Marketplace
        working-directory: apps/vscode
        run: npx ovsx --pat "$OVSX_PAT" publish --packagePath event-storming-modeler.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PUBLISH }}

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    # Pinned like the smoke workflow: VS Code needs the image's X server and GTK libraries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish -w packages/schema-model -w packages/dsl -w packages/transforms -w packages/renderer --access public --dry-run
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o event-storming-modeler.vsix
      # The publish jobs' smoke, so a dry run shows it passes before a release depends on it.
      - name: Smoke-test the VSIX in VS Code
        run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_VSIX: ${{ github.workspace }}/apps/vscode/event-storming-modeler.vsix
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-smoke-dry-run
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
